name: Testar o AGI Absoluta

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validacao:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Executar a suite
        env:
          MPPT24_DB_PATH: ':memory:'
        run: |
          python -m pip install -r requirements-dev.txt
          python -m unittest discover -s tests -v
      - name: Validar e arrancar o contentor
        run: |
          docker compose config --quiet
          docker compose up --build --wait --wait-timeout 120
      - name: Verificar a porta local e o chat
        shell: bash
        run: |
          test "$(docker compose port mppt24-agi 5013)" = "127.0.0.1:5013"
          curl --fail --silent --show-error --max-time 5 http://127.0.0.1:5013/health |
            python -c 'import json, sys; assert json.load(sys.stdin)["ok"] is True'
          curl --fail --silent --show-error --max-time 5 \
            --json '{"message":"converter 1 hora em minutos"}' http://127.0.0.1:5013/chat |
            python -c 'import json, sys; assert "60 minutos" in json.load(sys.stdin)["response"]'
      - name: Confirmar a voz local em português
        run: |
          curl --fail --silent --show-error --max-time 12 \
            --json '{"text":"Olá. Esta resposta tem voz em português."}' http://127.0.0.1:5013/voz \
            -o "$RUNNER_TEMP/resposta.wav"
          python -c 'import sys,wave; f=wave.open(sys.argv[1]); assert f.getnframes() > f.getframerate() and f.getsampwidth() == 2' "$RUNNER_TEMP/resposta.wav"
      - name: Mostrar registos em caso de falha
        if: failure()
        run: docker compose logs --no-color
      - name: Parar os contentores de teste
        if: always()
        run: docker compose down --volumes
