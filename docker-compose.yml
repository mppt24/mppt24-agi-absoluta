services:
  mppt24-agi:
    build: .
    ports:
      - "127.0.0.1:${MPPT24_PORT:-5013}:5013"
    volumes:
      - conversas:/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5013/health', timeout=2).close()"
      interval: 5s
      timeout: 3s
      retries: 6

volumes:
  conversas:
