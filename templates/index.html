<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>mppt24 AGI Absoluta</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #10141a; color: #ebf2f5; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: clamp(1rem, 4vw, 3rem); }
    main { max-width: 46rem; margin-inline: auto; }
    h1 { margin: .25rem 0 .75rem; font-size: clamp(2rem, 7vw, 3.6rem); line-height: 1.05; }
    h1 span { color: #9decce; }
    header p, .hint { color: #b1c0cc; line-height: 1.55; }
    section { margin-top: 2rem; border: 1px solid #34444e; border-radius: 1rem; padding: clamp(1rem, 4vw, 1.5rem); background: #161d25; }
    h2 { margin: 0 0 .75rem; font-size: 1.15rem; }
    .examples { display: flex; flex-wrap: wrap; gap: .5rem; margin: 0 0 1rem; }
    button, input { font: inherit; }
    button { cursor: pointer; border: 1px solid #45615c; background: #203130; color: #bdf1db; border-radius: .6rem; padding: .65rem .8rem; }
    button:hover { background: #2a4340; }
    button:disabled { opacity: .7; cursor: wait; }
    :focus-visible { outline: 2px solid #9decce; outline-offset: 3px; }
    label { display: block; margin-bottom: .5rem; }
    .entry { display: flex; flex-wrap: wrap; gap: .5rem; }
    input { flex: 1 1 12rem; min-width: 0; border: 1px solid #657c87; background: #11171e; color: #ebf2f5; padding: .75rem; border-radius: .6rem; }
    button[type="submit"] { background: #9decce; color: #11241c; font-weight: 700; }
    #respostas:empty { display: none; }
    #respostas { padding: 0; list-style: none; }
    #respostas li { margin-bottom: .5rem; border-inline-start: 2px solid #6dbca0; padding: .6rem .8rem; background: #10171d; white-space: pre-wrap; overflow-wrap: anywhere; }
    #estado { min-height: 1.5em; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1><span>mppt24</span> AGI Absoluta</h1>
      <p>Chat local para consultas por tema, cálculos e conversões.</p>
    </header>
    <section aria-labelledby="chat">
      <h2 id="chat">Experimenta um exemplo</h2>
      <div class="examples" aria-label="Exemplos de perguntas">
        <button type="button" data-exemplo="calcular sqrt(16)">Calcular uma raiz</button>
        <button type="button" data-exemplo="converter 1 hora em minutos">Converter tempo</button>
        <button type="button" data-exemplo="oxigénio">Consultar um tema</button>
      </div>
      <ul id="respostas" aria-live="polite" aria-label="Respostas"></ul>
      <form id="formulario">
        <label for="mensagem">A tua mensagem</label>
        <div class="entry">
          <input id="mensagem" name="mensagem" type="text" maxlength="2000" required autocomplete="off">
          <button type="submit">Enviar</button>
        </div>
      </form>
      <p class="hint" id="estado" role="status"></p>
    </section>
  </main>
  <script>
    const form = document.querySelector("#formulario");
    const input = document.querySelector("#mensagem");
    const status = document.querySelector("#estado");
    const replies = document.querySelector("#respostas");
    const send = form.querySelector('button[type="submit"]');
    for (const button of document.querySelectorAll("[data-exemplo]")) {
      button.addEventListener("click", () => {
        input.value = button.dataset.exemplo;
        input.focus();
      });
    }
    form.addEventListener("submit", async event => {
      event.preventDefault();
      const message = input.value.trim();
      if (!message || send.disabled) return;
      send.disabled = true;
      status.textContent = "A preparar a resposta…";
      try {
        const response = await fetch("/chat", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({message})
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "O pedido falhou.");
        const reply = document.createElement("li");
        reply.textContent = data.response;
        replies.append(reply);
        input.value = "";
        status.textContent = "";
      } catch (error) {
        status.textContent = error.message || "Não foi possível contactar o serviço.";
      } finally {
        send.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
